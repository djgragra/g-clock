<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G-Clock</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="mode-onair">
  <div class="root">

    <!-- HEADER: logo · ON AIR / REC · your buttons · date and time · settings -->
    <header>
      <div class="logo-area">
        <img id="logo" alt="" hidden>
        <div id="brandName" class="brand"><img class="brand-mark" src="img/logo.svg" alt=""><span class="logo-text"><span class="t1">STUDIO</span><span class="t2">G-CLOCK</span></span></div>
      </div>
      <div class="hd"></div>
      <div class="tog">
        <button id="btnOnAir" class="tog-btn act-red" type="button">ON AIR</button>
        <button id="btnRec" class="tog-btn" type="button">REC</button>
      </div>
      <nav id="links" class="studio-btns" aria-label="Links"></nav>
      <div class="hsp"></div>
      <button id="talkChip" class="talk-chip" type="button" hidden><span id="talkChipState" class="tc-label">MICTIME</span><span id="talkChipDigits" class="tc-digits">00:00</span></button>
      <div id="feedPill" class="pill" role="status" hidden><span class="pill-dot"></span><span id="feedPillText"></span></div>
      <div id="hDate" class="h-date">—</div>
      <div id="hTime" class="h-time">00:00:00</div>
      <div class="hd"></div>
      <button id="btnSettings" class="hbtn" type="button" data-i18n-title="settings.open"><span class="ic ic-gear"></span></button>
      <button id="btnFullscreen" class="hbtn" type="button" data-i18n-title="window.fullscreen"><span class="ic ic-full"></span></button>
    </header>

    <!-- Update notice: a thin strip under the header, never over the dial; hidden while recording and in full screen -->
    <div id="updateBanner" class="update-banner" role="status" hidden></div>

    <!-- MAIN: dial · headlines · weather   (REC: the timer takes the whole area) -->
    <main id="stage" class="main">

      <section class="col-clock">
        <div id="clockBadge" class="clock-badge onair">
          <span class="cb-dot"></span><span id="clockBadgeText">ON AIR</span>
        </div>
        <svg id="dial" class="dial" viewBox="0 0 700 700" role="img"></svg>
        <!-- MicTime (Settings → MicTime): under the dial; while recording it becomes a chip in the header -->
        <section id="talkPanel" class="talk-panel" aria-label="MicTime" hidden>
          <div id="talkDigits" class="talk-digits" role="timer" aria-live="off">00:00</div>
          <div class="talk-info">
            <div class="talk-line"><span id="talkState" class="talk-state">READY</span><span id="talkPills" class="talk-pills" role="status"></span></div>
            <div id="talkStep" class="talk-step"></div>
            <div id="talkNext" class="talk-next"></div>
            <div class="talk-hold"><div id="talkHold" class="talk-hold-fill"></div></div>
            <div id="talkHint" class="talk-nohint" hidden></div>
          </div>
          <div class="talk-ctl">
            <span id="talkProgramWrap" class="talk-prog" hidden><select id="talkProgram" class="talk-select" aria-label="Program"></select></span>
            <span class="talk-btns">
              <button id="talkPrev" class="talk-btn" type="button" data-i18n-title="talk.prog.prev">‹</button>
              <button id="talkNextBtn" class="talk-btn" type="button" data-i18n-title="talk.prog.next">›</button>
              <button id="talkRestart" class="talk-btn" type="button" data-i18n-title="talk.prog.restart">↺</button>
            </span>
            <span class="talk-btns">
              <button id="talkStart" class="talk-btn main" type="button">START / STOP</button>
              <button id="talkStop" class="talk-btn" type="button" data-i18n="talk.ctl.stop" hidden>STOP</button>
              <button id="talkReset" class="talk-btn" type="button" data-i18n="talk.ctl.reset">RESET</button>
            </span>
          </div>
        </section>
        <div id="eventBar" class="event-bar" role="status" hidden>
          <span class="ev-tag" data-i18n="ev.next">NEXT</span>
          <span id="evLabel" class="ev-label"></span>
          <span id="evTime" class="ev-time"></span>
          <span id="evCount" class="ev-count"></span>
        </div>
      </section>

      <div class="vdiv vdiv-news"></div>

      <section id="newsPanel" class="col-news">
        <div class="col-news-header">
          <span class="nh-label" data-i18n="news.title">LATEST NEWS</span>
          <div id="newsTabs" class="src-tabs"></div>
        </div>
        <div id="newsList" class="news-list"></div>
        <div id="newsCount" class="news-count"></div>
      </section>

      <div class="vdiv vdiv-info"></div>

      <section id="infoPanel" class="col-info">
        <div class="col-info-header"><span class="ih-label" data-i18n="wx.title">WEATHER</span></div>
        <div id="weatherRows" class="info-panel"></div>
        <button id="weatherCredit" class="credit" type="button"></button>
      </section>

      <!-- REC: recording timer with programs -->
      <section id="viewRec" class="rec-panel" hidden>
        <div class="t-stage">

          <div class="t-hdr">
            <div class="tog">
              <button id="modeFreeBtn" class="tog-btn act-blue" type="button" data-i18n="timer.mode.free">FREE</button>
              <button id="modeProgBtn" class="tog-btn" type="button" data-i18n="timer.mode.prog">PROGRAM</button>
            </div>
            <div class="prog-select-wrap">
              <select id="progSelect" class="prog-select" aria-label="Program"></select>
              <button id="btnManage" class="hbtn" type="button" data-i18n-title="timer.manage"><span class="ic ic-gear"></span></button>
            </div>
          </div>

          <div id="blockMeta" class="block-meta">
            <span id="bmProg" class="bm-prog">—</span><span class="bm-sep">·</span>
            <span id="bmPos" class="bm-pos"></span><span class="bm-sep">·</span>
            <span id="bmLabel" class="bm-label"></span>
          </div>

          <div class="display-wrap">
            <div id="timerState" class="state-badge"><span class="sb-dot"></span><span id="timerStateText">READY</span></div>
            <div id="timerDisplay" class="rec-display">00:00</div>
            <div id="timerElapsed" class="elapsed"></div>
            <div class="progress"><div id="timerBarFill" class="progress-bar"></div></div>
          </div>

          <div id="freeInputs" class="free-inputs">
            <input id="tMin" class="rec-input" type="text" inputmode="numeric" maxlength="2" placeholder="MIN" aria-label="Minutes">
            <span class="rec-sep">:</span>
            <input id="tSec" class="rec-input" type="text" inputmode="numeric" maxlength="2" placeholder="SEC" aria-label="Seconds">
          </div>
          <div id="timerPresets" class="presets"></div>

          <div class="rec-btns">
            <button id="tStart" class="rec-btn start" type="button" data-i18n="timer.start">START</button>
            <button id="tPause" class="rec-btn stop" type="button" data-i18n="timer.pause" hidden>PAUSE</button>
            <button id="tNext" class="rec-btn next" type="button" data-i18n="timer.next">END BLOCK</button>
            <button id="tRedo" class="rec-btn back" type="button" data-i18n="timer.redo">REDO</button>
            <button id="tBack" class="rec-btn back" type="button" data-i18n="timer.back">BACK</button>
            <button id="tReset" class="rec-btn reset" type="button" data-i18n="timer.reset">RESET</button>
          </div>

          <div class="options">
            <button id="optSound" class="opt" type="button" data-i18n="timer.sound">SOUND</button>
            <button id="optPreroll" class="opt" type="button">3·2·1</button>
            <button id="optDyn" class="opt" type="button" data-i18n="timer.dyn" data-i18n-title="timer.dynTitle">DYN</button>
            <button id="optReport" class="opt" type="button" data-i18n="timer.report" data-i18n-title="timer.reportTitle">REPORT</button>
          </div>
          <div class="rec-hint" data-i18n="timer.hint">SPACE start/pause · N end block · R reset · O On Air / Rec</div>
        </div>

        <aside id="blocksPanel" class="blocks-panel">
          <div class="bp-head">
            <span class="bp-title" data-i18n="timer.blocks">BLOCKS</span>
            <button id="btnRestore" class="bp-restore" type="button" data-i18n="timer.restore" data-i18n-title="timer.restoreTitle">RESTORE</button>
          </div>
          <div id="blocksList" class="bp-list"></div>
          <div id="blocksFoot" class="bp-foot"></div>
        </aside>
      </section>
    </main>

    <!-- News ticker -->
    <div id="ticker" class="ticker" hidden>
      <div class="tk-label"><span class="tk-dot"></span><span data-i18n="news.ticker">NEWS</span></div>
      <div class="tk-track"><div id="tkInner" class="tk-inner"></div></div>
    </div>
  </div>

  <!-- Pre-roll 3·2·1 -->
  <div id="preroll" class="preroll" hidden>
    <div id="prerollNum" class="preroll-num">3</div>
    <div class="preroll-hint" data-i18n="timer.prerollCancel">Space or Esc to cancel</div>
  </div>

  <!-- Programs: manage -->
  <div id="manageOverlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <span class="modal-title" data-i18n="manage.title">Manage programs</span>
        <button id="manageClose" class="modal-x" type="button" aria-label="Close">✕</button>
      </div>
      <div class="modal-body"><div id="manageList" class="prog-list"></div></div>
      <div class="modal-foot">
        <button id="manageImport" class="mbtn ghost" type="button" data-i18n="manage.import">IMPORT</button>
        <button id="manageExport" class="mbtn ghost" type="button" data-i18n="manage.export">EXPORT</button>
        <div class="mf-sp"></div>
        <span id="manageMsg" class="sync-badge"></span>
        <button id="manageNew" class="mbtn primary" type="button" data-i18n="manage.new">+ NEW</button>
      </div>
    </div>
  </div>

  <!-- Programs: editor -->
  <div id="editorOverlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <span id="editorTitle" class="modal-title">New program</span>
        <button id="editorClose" class="modal-x" type="button" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <label class="fld">
          <span class="fld-lbl" data-i18n="ed.name">Program name</span>
          <input id="edName" class="fld-in" type="text" maxlength="60" data-i18n-placeholder="ed.namePh">
        </label>
        <div class="ed-blocks-head"><span data-i18n="timer.blocks">BLOCKS</span><span id="edTotal" class="ed-total"></span></div>
        <div id="edBlocks" class="ed-blocks"></div>
        <button id="edAdd" class="mbtn ghost addrow" type="button" data-i18n="ed.add">+ ADD BLOCK</button>
      </div>
      <div class="modal-foot">
        <button id="edDelete" class="mbtn danger" type="button" data-i18n="ed.delete">DELETE</button>
        <div class="mf-sp"></div>
        <button id="edCancel" class="mbtn ghost" type="button" data-i18n="settings.close">CLOSE</button>
        <button id="edSave" class="mbtn primary" type="button" data-i18n="ed.save">SAVE</button>
      </div>
    </div>
  </div>

  <!-- Programs: report -->
  <div id="reportOverlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <span id="reportTitle" class="modal-title">Recording report</span>
        <button id="reportClose" class="modal-x" type="button" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <table id="reportTable" class="report-table"></table>
        <div id="reportTot" class="report-tot"></div>
      </div>
      <div class="modal-foot">
        <button id="reportCopy" class="mbtn ghost" type="button" data-i18n="rep.copy">COPY</button>
        <button id="reportSave" class="mbtn ghost" type="button" data-i18n="rep.export">EXPORT .TXT</button>
        <div class="mf-sp"></div>
        <button id="reportOk" class="mbtn primary" type="button" data-i18n="settings.close">CLOSE</button>
      </div>
    </div>
  </div>

  <!-- What's new, once after an update -->
  <div id="newOverlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="newTitle">
      <div class="modal-head">
        <span class="modal-title"><img class="modal-logo" src="img/logo.svg" alt=""><span id="newTitle"></span></span>
        <button id="newClose" class="modal-x" type="button" aria-label="Close">✕</button>
      </div>
      <div class="modal-body"><ul id="newList" class="new-list"></ul></div>
      <div class="modal-foot"><div class="mf-sp"></div><button id="newOk" class="mbtn primary" type="button" data-i18n="new.ok">OK</button></div>
    </div>
  </div>

  <!-- Settings -->
  <div id="settings" class="settings" hidden>
    <div id="settingsPanel" class="settings-panel" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <nav id="settingsNav" class="settings-nav"></nav>
      <div class="settings-body">
        <div class="settings-head">
          <h1 id="settingsTitle" data-i18n="settings.title">Settings</h1>
          <button id="settingsClose" type="button" class="btn" data-i18n="settings.close">Close</button>
        </div>
        <div id="settingsContent" class="settings-content"></div>
      </div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/i18n-talk.js"></script>
  <script src="js/util.js"></script>
  <script src="js/dialmath.js"></script>
  <script src="js/schedmath.js"></script>
  <script src="js/timermath.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/programs.js"></script>
  <script src="js/news.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/links.js"></script>
  <script src="js/updates.js"></script>
  <script src="js/settings.js"></script>
  <script type="module" src="js/talk-settings.js"></script>
  <script type="module" src="js/talk.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
